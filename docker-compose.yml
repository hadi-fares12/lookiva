services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lookiva
      POSTGRES_USER: lookiva
      POSTGRES_PASSWORD: lookiva
    ports:
      - "5432:5432"
    volumes:
      - lookiva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookiva -d lookiva"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lookiva_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lookiva_admin
      MINIO_ROOT_PASSWORD: lookiva_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lookiva_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  lookiva_postgres:
  lookiva_redis:
  lookiva_minio:
