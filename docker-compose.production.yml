services:
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["sh", "-c", "./apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma"]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  workers:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.workers
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  customer-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: customer-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL required}
    env_file: .env.production
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  business-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: business-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL required}
    env_file: .env.production
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: admin-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL required}
    env_file: .env.production
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lookiva}
      POSTGRES_USER: ${POSTGRES_USER:-lookiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - prod_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lookiva} -d ${POSTGRES_DB:-lookiva}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    volumes:
      - prod_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    volumes:
      - prod_minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prod_postgres:
  prod_redis:
  prod_minio:
