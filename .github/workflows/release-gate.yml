name: Release Gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: lookiva_test
          POSTGRES_USER: lookiva
          POSTGRES_PASSWORD: lookiva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lookiva -d lookiva_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lookiva:lookiva_test@localhost:5432/lookiva_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-32-characters-minimum-123
      JWT_REFRESH_SECRET: test-refresh-secret-32-characters-minimum-456
      SMS_PROVIDER: console
      EMAIL_PROVIDER: console
      PUSH_PROVIDER: console
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test-secret-value
      PUBLIC_CUSTOMER_WEB_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/static_audit.py
      - run: pnpm --filter @lookiva/api prisma:generate
      - run: pnpm --filter @lookiva/api prisma:migrate
      - name: Seed required production reference data
        run: pnpm --filter @lookiva/api prisma:seed:prod
      - run: pnpm typecheck
      - run: pnpm --filter @lookiva/workers typecheck
      - run: pnpm test
      - run: pnpm --filter @lookiva/api test:int
      - run: pnpm build
      - run: pnpm --filter @lookiva/workers build

      - name: Boot compiled API and verify health
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @lookiva/api start > api-runtime.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4000/health > /tmp/lookiva-health.json; then
              cat /tmp/lookiva-health.json

              echo "Smoke testing real customer registration against compiled API..."
              curl --fail --silent --show-error \
                -H 'Content-Type: application/json' \
                -d '{"email":"runtime-smoke@lookiva.test","password":"Runtime123!","firstName":"Runtime","lastName":"Smoke","locale":"en","acceptTerms":true}' \
                http://127.0.0.1:4000/api/v1/auth/register \
                > /tmp/lookiva-register.json
              cat /tmp/lookiva-register.json
              grep -q 'accessToken' /tmp/lookiva-register.json

              exit 0
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "Compiled API exited before becoming healthy."
              cat api-runtime.log
              exit 1
            fi

            sleep 1
          done

          echo "Compiled API did not become healthy within 45 seconds."
          cat api-runtime.log
          exit 1
