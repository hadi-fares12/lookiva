name: Prisma Migrate Check

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/prisma/**"
      - ".github/workflows/prisma-migrate-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/prisma/**"
      - ".github/workflows/prisma-migrate-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-check:
    name: Validate & Diff Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"
      DIRECT_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U prisma -d shadow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate Prisma schema
        working-directory: apps/api
        run: pnpm exec prisma validate

      - name: Format check Prisma schema
        working-directory: apps/api
        run: |
          pnpm exec prisma format --schema prisma/schema.prisma
          git diff --exit-code -- prisma/schema.prisma

      - name: Apply all migrations to shadow DB (sanity check)
        working-directory: apps/api
        env:
          DIRECT_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"
          DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"
        run: pnpm exec prisma migrate deploy

      - name: Verify migration status after deploy
        working-directory: apps/api
        env:
          DIRECT_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"
          DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public"
        run: pnpm exec prisma migrate status

      - name: Verify no structural migration drift
        working-directory: apps/api
        run: |
          # The historical baseline intentionally uses explicit idx_/constraint names
          # while Prisma derives different default names. Report naming-only drift,
          # but fail if the actual table/column/type structure no longer matches.
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            > prisma-drift.txt

          cat prisma-drift.txt

          if grep -Eiq 'Added table|Removed table|Added column|Removed column|Changed column|Changed the type|Added enum|Removed enum' prisma-drift.txt; then
            echo "ERROR: Structural Prisma schema drift detected."
            exit 1
          fi

          echo "No structural table/column/type drift detected."

      - name: Generate Prisma client (compile check)
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Upload migration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migration-report
          path: |
            apps/api/prisma/schema.prisma
            apps/api/prisma/migrations/
            apps/api/prisma-drift.txt
          if-no-files-found: ignore
          retention-days: 7
