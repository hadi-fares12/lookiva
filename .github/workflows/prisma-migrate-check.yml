name: Prisma Migrate Check

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/prisma/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/prisma/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-check:
    name: Validate & Diff Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIRECT_URL: postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/shadow_db?schema=public

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U prisma -d shadow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm@9
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate Prisma schema
        working-directory: apps/api
        run: pnpm exec prisma validate

      - name: Format check Prisma schema
        working-directory: apps/api
        run: |
          pnpm exec prisma format --schema prisma/schema.prisma
          git diff --exit-code -- prisma/schema.prisma

      - name: Apply all migrations to shadow DB
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Verify migration status after deploy
        working-directory: apps/api
        run: pnpm exec prisma migrate status

      - name: Verify structural migration drift
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            > prisma-drift.txt

          cat prisma-drift.txt

          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          text = Path("prisma-drift.txt").read_text(encoding="utf-8")
          remaining = []
          blocks = []
          current = None

          def flush():
              global current
              if current is not None:
                  blocks.append(current)
                  current = None

          for raw in text.splitlines():
              line = raw.strip()
              if not line or line == "No difference detected.":
                  continue

              table = re.fullmatch(r"\[\*\] Changed the `(.+)` table", line)
              if table:
                  flush()
                  current = {"table": table.group(1), "lines": []}
                  continue

              if current is None:
                  if re.fullmatch(r"\[\*\] Renamed index .+ to .+", line):
                      continue
                  remaining.append(raw)
              else:
                  current["lines"].append(line)

          flush()

          for block in blocks:
              removed_fk = Counter()
              added_fk = Counter()
              structural = []

              for line in block["lines"]:
                  if re.fullmatch(r"\[\*\] Renamed index .+ to .+", line):
                      continue

                  removed = re.fullmatch(r"\[-\] Removed foreign key on columns (.+)", line)
                  if removed:
                      removed_fk[removed.group(1)] += 1
                      continue

                  added = re.fullmatch(r"\[\+\] Added foreign key on columns (.+)", line)
                  if added:
                      added_fk[added.group(1)] += 1
                      continue

                  structural.append(line)

              if removed_fk != added_fk:
                  structural.append(
                      f"Foreign-key drift differs in {block['table']}: "
                      f"removed={dict(removed_fk)}, added={dict(added_fk)}"
                  )

              if structural:
                  remaining.append(f"[*] Changed the {block['table']} table")
                  remaining.extend(f"  {line}" for line in structural)

          if remaining:
              print("Structural Prisma drift detected:")
              print("\n".join(remaining))
              raise SystemExit(1)

          print("Schema is structurally aligned; only legacy index/constraint naming differs.")
          PY

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Upload migration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migration-report
          path: |
            apps/api/prisma/schema.prisma
            apps/api/prisma/migrations/
            apps/api/prisma-drift.txt
          if-no-files-found: ignore
          retention-days: 7
